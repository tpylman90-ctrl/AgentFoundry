name: Godot benchmark reference verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [benchmarks/godot-code/selftest-now.txt]

permissions:
  contents: read

jobs:
  validate-reference:
    name: Verify all Godot engine assertions have passing reference code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and verify official Godot engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fLsS --retry 4 \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot/engine.zip"
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  '"$RUNNER_TEMP/godot/engine.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod 755 "$RUNNER_TEMP/godot/godot"
          docker build -q -f benchmarks/godot-code/Dockerfile -t af-godot-engine:4.5.2 benchmarks/godot-code

      - name: Run all three reference implementations through actual Godot
        shell: bash
        run: |
          set -euo pipefail
          for task in equipment forge abilities; do
            echo "Reference code test: $task"
            set +e
            output="$(timeout --kill-after=4s 12s docker run --rm --network none \
              --cpus 1 --memory 768m --pids-limit 128 \
              --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,size=128m \
              --security-opt no-new-privileges --cap-drop ALL \
              -v "$RUNNER_TEMP/godot/godot:/usr/local/bin/godot:ro" \
              -v "$GITHUB_WORKSPACE/benchmarks/godot-code/project.godot:/project/project.godot:ro" \
              -v "$GITHUB_WORKSPACE/benchmarks/godot-code/tests/$task.gd:/project/test.gd:ro" \
              -v "$GITHUB_WORKSPACE/benchmarks/godot-code/reference/$task.gd:/project/generated.gd:ro" \
              af-godot-engine:4.5.2 \
              /usr/local/bin/godot --headless --path /project --script /project/test.gd 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output" | grep '^AF_TEST:' || true
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::$task reference engine exited with code $rc"
              printf '%s\n' "$output" | tail -35
              exit 1
            fi
            INPUT="$output" TASK="$task" python3 - <<'PY'
          import os, re
          names = {'equipment':('E',9),'forge':('F',8),'abilities':('A',9)}
          prefix,total = names[os.environ['TASK']]
          actual = re.findall(r'^AF_TEST:([EFA][0-9]{2}):(PASS|FAIL)\s*$',os.environ['INPUT'],flags=re.M)
          expected = [(f'{prefix}{i:02d}','PASS') for i in range(1,total+1)]
          if sorted(actual) != sorted(expected):
              raise SystemExit(f'Invalid or failed reference tests for {os.environ["TASK"]}: {actual!r}')
          print(f'REFERENCE_PASS {os.environ["TASK"]} {total}/{total}')
          PY
          done
          echo 'All 26 real-engine reference checks passed.'
