name: Godot code pilot (real engine)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Baseline, paired with a private skill, or auto-detect secret"
        type: choice
        options: [auto, baseline, paired]
        default: auto
        required: true
      skill_revision:
        description: Private skill revision for treatment arm (does not change published source)
        type: choice
        options: ['v0.2', 'v0.3']
        default: 'v0.2'
        required: true
  push:
    branches: [main]
    paths: [benchmarks/godot-code/launch.txt, benchmarks/godot-code/v03-run-now.txt]

permissions:
  contents: read

jobs:
  godot-code-test:
    name: Generate GDScript and execute Godot 4.5.2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AF-V03-TRIAL]') && 'paired') || 'auto' }}
      SKILL_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.skill_revision || (github.event_name == 'push' && contains(github.event.head_commit.message, '[AF-V03-TRIAL]') && 'v0.3') || 'v0.2' }}
      MODEL: qwen-coder-1.5b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate benchmark harness before loading secrets
        run: |
          python3 -m py_compile tools/run_godot_coding_pilot.py tools/score_godot_coding.py
          python3 -m unittest discover -s tests -v

      - name: Fetch official Godot, public model and sandbox dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/af-godot" "$RUNNER_TEMP/af-model"
          curl -fLsS --retry 4 --retry-delay 2 \
            'https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/af-godot/engine.zip"
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  '"$RUNNER_TEMP/af-godot/engine.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/af-godot/engine.zip" -d "$RUNNER_TEMP/af-godot"
          mv "$RUNNER_TEMP/af-godot/Godot_v4.5.2-stable_linux.x86_64" "$RUNNER_TEMP/af-godot/godot"
          chmod 755 "$RUNNER_TEMP/af-godot/godot"

          curl -fLsS --retry 4 --retry-delay 3 \
            'https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' \
            -o "$RUNNER_TEMP/af-model/model.gguf"
          test "$(stat --format='%s' "$RUNNER_TEMP/af-model/model.gguf")" -gt 900000000
          sha256sum "$RUNNER_TEMP/af-model/model.gguf" | cut -d' ' -f1 > "$RUNNER_TEMP/af-model/model.sha256"

          docker pull python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c
          docker pull ghcr.io/ggml-org/llama.cpp@sha256:c0a11067c72bb1eb330b8bddbf9869274c195e596bf4fae55fd527102e644b85
          docker build -q -f benchmarks/godot-code/Dockerfile -t af-godot-engine:4.5.2 benchmarks/godot-code

      - name: Prove real Godot engine operates in networkless sandbox
        shell: bash
        run: |
          set -euo pipefail
          output="$(timeout 35s docker run --rm --network none \
            --cpus 1 --memory 768m --pids-limit 128 \
            --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,size=128m \
            --security-opt no-new-privileges --cap-drop ALL \
            -v "$RUNNER_TEMP/af-godot/godot:/usr/local/bin/godot:ro" \
            -v "$GITHUB_WORKSPACE/benchmarks/godot-code/project.godot:/project/project.godot:ro" \
            -v "$GITHUB_WORKSPACE/benchmarks/godot-code/preflight.gd:/project/preflight.gd:ro" \
            af-godot-engine:4.5.2 \
            /usr/local/bin/godot --headless --path /project --script /project/preflight.gd)"
          echo "$output" | grep 'AF_GODOT_ENGINE_READY'
          echo "Sandboxed Godot 4.5.2: PASS"

      - name: Verify reference GDScript passes all Godot checks before loading secrets
        shell: bash
        run: |
          set -euo pipefail
          for task in equipment forge abilities; do
            set +e
            output="$(timeout --kill-after=4s 12s docker run --rm --network none \
              --cpus 1 --memory 768m --pids-limit 128 \
              --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,size=128m \
              --security-opt no-new-privileges --cap-drop ALL \
              -v "$RUNNER_TEMP/af-godot/godot:/usr/local/bin/godot:ro" \
              -v "$GITHUB_WORKSPACE/benchmarks/godot-code/project.godot:/project/project.godot:ro" \
              -v "$GITHUB_WORKSPACE/benchmarks/godot-code/tests/$task.gd:/project/test.gd:ro" \
              -v "$GITHUB_WORKSPACE/benchmarks/godot-code/reference/$task.gd:/project/generated.gd:ro" \
              af-godot-engine:4.5.2 \
              /usr/local/bin/godot --headless --path /project --script /project/test.gd 2>&1)"
            rc=$?
            set -e
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::Reference engine exited unsuccessfully for $task"
              exit 1
            fi
            REFERENCE_LOG="$output" REFERENCE_TASK="$task" python3 -c '
          import os, re
          prefix, count = {"equipment":("E",9),"forge":("F",8),"abilities":("A",9)}[os.environ["REFERENCE_TASK"]]
          rows = re.findall(r"^AF_TEST:([EFA][0-9]{2}):(PASS|FAIL)",os.environ["REFERENCE_LOG"],flags=re.M)
          expected = [(f"{prefix}{i:02d}","PASS") for i in range(1,count+1)]
          if sorted(rows) != sorted(expected):
              raise SystemExit("Reference suite failed for "+os.environ["REFERENCE_TASK"])
          print("REFERENCE_PASS",os.environ["REFERENCE_TASK"],count)
          '
          done

      - name: Resolve conditions and install encrypted skill only on ephemeral runner
        shell: bash
        env:
          SKILL_V02_BASE64: ${{ secrets.AGENTFOUNDRY_SKILL_B64 }}
          SKILL_V03_BASE64: ${{ secrets.AGENTFOUNDRY_SKILL_V03_B64 }}
        run: |
          set -euo pipefail
          case "$SKILL_REVISION" in
            v0.2) SKILL_BASE64="${SKILL_V02_BASE64:-}" ;;
            v0.3) SKILL_BASE64="${SKILL_V03_BASE64:-}" ;;
            *) echo "::error::Unknown skill revision" && exit 1 ;;
          esac
          echo "Selected private skill revision: $SKILL_REVISION"
          if [[ "$MODE" == "auto" ]]; then
            if [[ -n "${SKILL_BASE64:-}" ]]; then
              MODE=paired
            else
              MODE=baseline
            fi
            echo "MODE=$MODE" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RUNNER_TEMP/af-code-private"
          chmod 700 "$RUNNER_TEMP/af-code-private"
          if [[ "$MODE" == "paired" ]]; then
            if [[ -z "${SKILL_BASE64:-}" ]]; then
                echo "::error::Paired mode requires the Actions secret selected for $SKILL_REVISION"
              exit 1
            fi
            umask 077
            printf '%s' "$SKILL_BASE64" | base64 --decode > "$RUNNER_TEMP/af-code-private/SKILL.md"
            test "$(wc -c < "$RUNNER_TEMP/af-code-private/SKILL.md")" -ge 100
            if [[ "$SKILL_REVISION" == "v0.3" ]]; then
              printf '%s  %s\n' '36dc36213804a1b06f82c5f9c20267b0216ecaf228a8344903bbaacd597e760f' "$RUNNER_TEMP/af-code-private/SKILL.md" | sha256sum --check >/dev/null || { echo "::error::v0.3 skill digest mismatch; inference aborted"; exit 1; }
              echo "v0.3 skill digest verified."
            fi
          fi
          echo "Evaluation mode: $MODE"

      - name: Start local model with no outbound network route
        shell: bash
        run: |
          set -euo pipefail
          docker network create --internal af-code-private
          test "$(docker network inspect af-code-private --format '{{.Internal}}')" = true
          docker run -d --name af-model --network af-code-private --cpus 2 \
            --read-only --tmpfs /tmp:rw,size=128m \
            --security-opt no-new-privileges --cap-drop ALL \
            -v "$RUNNER_TEMP/af-model/model.gguf:/models/model.gguf:ro" \
            ghcr.io/ggml-org/llama.cpp@sha256:c0a11067c72bb1eb330b8bddbf9869274c195e596bf4fae55fd527102e644b85 \
            -m /models/model.gguf -a "$MODEL" -c 8192 -t 2 -np 1 \
            --host 0.0.0.0 --port 8080
          for i in $(seq 1 50); do
            if docker run --rm --network af-code-private --read-only --cap-drop ALL \
              python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c \
              python -c 'import urllib.request; urllib.request.urlopen("http://af-model:8080/health",timeout=3).read()' >/dev/null 2>&1; then
              echo "Isolated model health: PASS"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Model unavailable"
          docker logs --tail 20 af-model || true
          exit 1

      - name: Generate original code without publishing prompts or source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/af-code-runs"
          args=()
          if [[ "$MODE" == "paired" ]]; then
            args+=(--skill-file /private/SKILL.md)
          fi
          docker run --rm --name af-code-generator \
            --network af-code-private --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,size=128m \
            --security-opt no-new-privileges --cap-drop ALL \
            --env AGENTFOUNDRY_ISOLATED_DOCKER=af-code-private \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/af-code-private:/private:ro" \
            -v "$RUNNER_TEMP/af-code-runs:/results:rw" \
            python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c \
            python /work/tools/run_godot_coding_pilot.py \
            --mode "$MODE" --output /results "${args[@]}"

      - name: Execute generated GDScript in networkless sandbox
        shell: bash
        run: |
          set -euo pipefail
          for task in equipment forge abilities; do
            for arm in baseline skill; do
              if [[ "$MODE" == "baseline" && "$arm" == "skill" ]]; then
                continue
              fi
              code="$RUNNER_TEMP/af-code-runs/$task/$arm/generated.gd"
              out="$RUNNER_TEMP/af-code-logs/$task/$arm"
              mkdir -p "$out"
              if [[ ! -f "$code" ]]; then
                echo "source_not_generated" > "$out/engine.log"
                echo 2 > "$out/exit.txt"
                continue
              fi
              set +e
              timeout --kill-after=4s 12s docker run --rm --network none \
                --cpus 1 --memory 768m --pids-limit 128 \
                --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp:rw,size=128m \
                --security-opt no-new-privileges --cap-drop ALL \
                -v "$RUNNER_TEMP/af-godot/godot:/usr/local/bin/godot:ro" \
                -v "$GITHUB_WORKSPACE/benchmarks/godot-code/project.godot:/project/project.godot:ro" \
                -v "$GITHUB_WORKSPACE/benchmarks/godot-code/tests/$task.gd:/project/test.gd:ro" \
                -v "$code:/project/generated.gd:ro" \
                af-godot-engine:4.5.2 \
                /usr/local/bin/godot --headless --path /project --script /project/test.gd \
                > "$out/engine.log" 2>&1
              rc=$?
              set -e
              echo "$rc" > "$out/exit.txt"
              echo "Executed $task $arm; engine exit status recorded privately."
            done
          done

      - name: Publish score-only report (no generated code or raw engine logs)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/score_godot_coding.py \
            --tasks benchmarks/godot-code/tasks.json \
            --generation "$RUNNER_TEMP/af-code-runs/generation.json" \
            --logs "$RUNNER_TEMP/af-code-logs" \
            --output "$RUNNER_TEMP/af-code-public"

      - name: Upload safe scoring evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentfoundry-godot-code-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/af-code-public/REPORT.md
            ${{ runner.temp }}/af-code-public/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Destroy private skill, generated code, logs, and containers
        if: always()
        shell: bash
        run: |
          docker rm -f af-model >/dev/null 2>&1 || true
          docker network rm af-code-private >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/af-code-private" "$RUNNER_TEMP/af-code-runs" "$RUNNER_TEMP/af-code-logs"
