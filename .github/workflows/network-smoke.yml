name: Confidential inference network smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [benchmarks/network-smoke.txt]

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start no-egress container with loopback-only port
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f af-network-probe >/dev/null 2>&1 || true; docker network rm af-probe-private >/dev/null 2>&1 || true' EXIT
          docker network create --internal af-probe-private
          test "$(docker network inspect af-probe-private --format '{{.Internal}}')" = "true"
          docker run --rm -d --name af-network-probe --network af-probe-private \
            python:3.11-alpine \
            python -m http.server 18765 --bind 0.0.0.0
          container_ip="$(docker inspect af-network-probe --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          if [[ -z "$container_ip" ]]; then exit 1; fi
          response=""
          for i in $(seq 1 20); do
            response="$(curl -fsS --max-time 2 http://$container_ip:18765/ || true)"
            if [[ -n "$response" ]]; then
              echo "PASS: runner reaches internal Docker bridge address"
              docker run --rm --network af-probe-private \
                python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c \
                python -c 'import urllib.request; r=urllib.request.urlopen("http://af-network-probe:18765/", timeout=5); assert r.status == 200'
              echo "PASS: peer container reaches service inside zero-egress network"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail=10 af-network-probe || true
          echo "::error::Runner host could not reach internal Docker bridge container"
          exit 1
