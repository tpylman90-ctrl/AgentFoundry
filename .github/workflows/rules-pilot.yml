name: Rules pilot (real local inference)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Baseline or paired with a private skill secret
        type: choice
        options: [baseline, paired, auto]
        default: auto
        required: true
      repetitions:
        description: Number of repetitions per scenario (1-3)
        type: choice
        options: ['1', '2', '3']
        default: '1'
        required: true
  push:
    branches: [main]
    paths:
      - benchmarks/rpg-rules/launch.txt
      - benchmarks/rpg-rules/run-now.txt

permissions:
  contents: read

jobs:
  model-pilot:
    name: CPU Qwen RPG rules pilot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
      REPETITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.repetitions || '3' }}
      MODEL: qwen-coder-1.5b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify benchmark and score checks
        run: python3 -m unittest discover -s tests -v

      - name: Download public model weights before accessing private skill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agentfoundry-model"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 \
            'https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' \
            --output "$RUNNER_TEMP/agentfoundry-model/model.gguf"
          test "$(stat --format='%s' "$RUNNER_TEMP/agentfoundry-model/model.gguf")" -gt 900000000
          docker pull python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c

      - name: Resolve local-only test mode and prepare private skill
        shell: bash
        env:
          SKILL_BASE64: ${{ secrets.AGENTFOUNDRY_SKILL_B64 }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "auto" ]]; then
            if [[ -n "${SKILL_BASE64:-}" ]]; then
              MODE=paired
            else
              MODE=baseline
            fi
            echo "MODE=$MODE" >> "$GITHUB_ENV"
            echo "Selected evaluation condition: $MODE"
          fi
          mkdir -p "$RUNNER_TEMP/agentfoundry-private"
          chmod 700 "$RUNNER_TEMP/agentfoundry-private"
          if [[ "$MODE" == "paired" ]]; then
            if [[ -z "${SKILL_BASE64:-}" ]]; then
              echo "::error::Paired mode requires GitHub secret AGENTFOUNDRY_SKILL_B64"
              exit 1
            fi
            umask 077
            mkdir -p "$RUNNER_TEMP/agentfoundry-private"
            printf '%s' "$SKILL_BASE64" | base64 --decode > "$RUNNER_TEMP/agentfoundry-private/SKILL.md"
            test "$(wc -c < "$RUNNER_TEMP/agentfoundry-private/SKILL.md")" -ge 100
          fi

      - name: Start model on isolated Docker network
        shell: bash
        run: |
          set -euo pipefail
          docker network create --internal af-private
          test "$(docker network inspect af-private --format '{{.Internal}}')" = "true"
          docker run -d --name af-model --network af-private --cpus 2 \
            --read-only --tmpfs /tmp:rw,size=128m \
            --security-opt no-new-privileges --cap-drop ALL \
            -v "$RUNNER_TEMP/agentfoundry-model/model.gguf:/models/model.gguf:ro" \
            ghcr.io/ggml-org/llama.cpp@sha256:c0a11067c72bb1eb330b8bddbf9869274c195e596bf4fae55fd527102e644b85 \
            -m /models/model.gguf -a "$MODEL" -c 4096 -t 2 -np 1 \
            --host 0.0.0.0 --port 8080
          # An isolated evaluator can access 'af-model' on the same network.
          # Neither container publishes ports to the runner or public Internet.
          for i in $(seq 1 48); do
            if docker run --rm --network af-private --read-only --cap-drop ALL \
              python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c \
              python -c 'import urllib.request; urllib.request.urlopen("http://af-model:8080/health", timeout=2).read()' >/dev/null 2>&1; then
              echo "Isolated model health check: PASS"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Isolated model did not respond to a same-network client"
          docker logs --tail=25 af-model || true
          exit 1

      - name: Run independent inference from isolated evaluator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/af-pilot-results"
          extra=()
          if [[ "$MODE" == "paired" ]]; then
            extra+=(--skill-file /private/SKILL.md)
          fi
          docker run --rm --name af-evaluator --network af-private --cpus 2 \
            --read-only --tmpfs /tmp:rw,size=128m \
            --security-opt no-new-privileges --cap-drop ALL \
            --env AGENTFOUNDRY_ISOLATED_DOCKER=af-private \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/agentfoundry-private:/private:ro" \
            -v "$RUNNER_TEMP/af-pilot-results:/results:rw" \
            python:3.11-alpine@sha256:8b92101d156b060d6999d3382bbe98f6851fbbf7c4bddbe3833818f3565d2b4c \
            python /work/tools/run_rules_pilot.py \
            --endpoint http://af-model:8080/v1/chat/completions \
            --model "$MODEL" --mode "$MODE" \
            --repetitions "$REPETITIONS" --timeout 180 \
            --output /results "${extra[@]}"
          cat "$RUNNER_TEMP/af-pilot-results/REPORT.md"

      - name: Upload privacy-safe score files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentfoundry-rules-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/af-pilot-results/REPORT.md
            ${{ runner.temp }}/af-pilot-results/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Destroy private skill and model container
        if: always()
        shell: bash
        run: |
          docker rm -f af-model >/dev/null 2>&1 || true
          docker network rm af-private >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/agentfoundry-private"
