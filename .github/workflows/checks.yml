name: AgentFoundry checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-tests:
    name: Verify rules pilot without model/API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and run offline tests
        run: |
          python3 -m py_compile tools/run_rules_pilot.py tests/test_rules_pilot.py
          python3 -m unittest discover -s tests -v
